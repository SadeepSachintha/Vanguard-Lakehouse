name: Data Quality & Contract Gatekeeping CI

on:
  push:
    branches: [ main, dev, "feature/**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper-pipeline:
    name: Automated Data Contract & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Lakehouse Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/requirements.txt
          pip install dbt-core==1.8.0 dbt-duckdb==1.8.0 pyyaml tabulate

      - name: "Step 1: Ingestion Validation (Reject Corrupted Bronze Payloads)"
        run: |
          echo "### Ingesting and pre-validating Bronze payloads with Pydantic..."
          python ingestion/cbsl_scraper.py \
            --start-date 2026-08-01 \
            --end-date 2026-10-21 \
            --no-s3
          python ingestion/write_to_iceberg.py \
            --branch feature/ci-contract-gate \
            --maintenance

      - name: "Step 2: Validate dbt Dependencies & Compile Models"
        working-directory: ./dbt_transforms
        run: |
          echo "### Compiling dbt lakehouse project..."
          dbt deps --profiles-dir . || true
          dbt compile --profiles-dir .

      - name: "Step 3: Run dbt Staging Models with Enforced Contracts"
        working-directory: ./dbt_transforms
        run: |
          echo "### Enforcing schema contracts on Staging Silver tier..."
          dbt run --models tag:staging --profiles-dir .
          dbt run --profiles-dir .

      - name: "Step 4: Run Singular SQL Tests & Referential Integrity Assertions"
        working-directory: ./dbt_transforms
        run: |
          echo "### Executing singular domain assertions and integrity tests..."
          dbt test --profiles-dir .

      - name: "Step 5: Execute Soda Core Quality & Anomaly Assertions"
        run: |
          echo "### Running Soda Core statistical anomalies & schema gatekeeper..."
          python soda/soda_runner.py \
            --db dbt_transforms/iceflow_lakehouse.duckdb \
            --checks soda/checks_commodities.yml \
            --config soda/configuration.yml

      - name: "Step 6: Run Chaos CI Defensive Negative-Test Suite"
        run: |
          echo "### Executing Chaos defect injection suite (verifying defense gates halt bad data)..."
          python tests/chaos_test_suite.py

      - name: "Step 7: Generate Executive SLA & Quality Dashboard Report"
        if: always()
        run: |
          echo "### Generating Executive SLA and Data Quality Reports..."
          python analytics/generate_quality_report.py
          if [ -f "analytics/reports/quality_summary.md" ]; then
            cat analytics/reports/quality_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Step 8: Upload Interactive Quality Dashboard Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lakehouse-quality-dashboard
          path: analytics/reports/quality_dashboard.html
          if-no-files-found: ignore
